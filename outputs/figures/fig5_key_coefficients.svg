  <line x1="120" y1="90" x2="120" y2="420" stroke="black"/>
  <rect x="175" y="120" width="90" height="300" fill="#4e79a7"/>
  <rect x="315" y="330" width="90" height="90" fill="#4e79a7"/>
  <rect x="455" y="405" width="90" height="15" fill="#4e79a7"/>
